<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
  <defs>
    <linearGradient id="post-bg" x1="90" y1="45" x2="980" y2="1300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171717"/>
      <stop offset=".52" stop-color="#080808"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <filter id="post-shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="35" stdDeviation="36" flood-color="#000" flood-opacity=".7"/></filter>
    <clipPath id="post-phone"><rect x="344" y="564" width="392" height="620" rx="54"/></clipPath>
  </defs>

  <rect width="1080" height="1350" fill="url(#post-bg)"/>
  <circle cx="936" cy="130" r="244" fill="#FFFFFF" fill-opacity=".025"/>
  <circle cx="936" cy="130" r="170" stroke="#FFFFFF" stroke-opacity=".08"/>
  <circle cx="936" cy="130" r="102" stroke="#FFFFFF" stroke-opacity=".12"/>
  <path d="M0 1050C287 977 536 1144 1080 965V1350H0V1050Z" fill="#FFFFFF" fill-opacity=".027"/>

  <g transform="translate(66 62)">
    <circle cx="31" cy="31" r="30" fill="#F7F7F4"/>
    <text x="31" y="42" fill="#0A0A0A" font-family="Georgia, serif" font-size="35" text-anchor="middle">n</text>
    <text x="76" y="40" fill="#FFFFFF" font-family="Georgia, serif" font-size="36" letter-spacing="-2">nora</text>
  </g>
  <rect x="777" y="75" width="238" height="37" rx="18.5" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".13"/>
  <text x="896" y="99" fill="#B5B5AF" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.4" text-anchor="middle">APOYO EMOCIONAL CON IA</text>

  <text x="540" y="254" fill="#FFFFFF" font-family="Georgia, serif" font-size="72" letter-spacing="-3" text-anchor="middle">
    <tspan x="540">No tienes que</tspan>
    <tspan x="540" dy="74">poder con todo</tspan>
    <tspan x="540" dy="74" fill="#BDBDB8" font-style="italic">a solas.</tspan>
  </text>
  <text x="540" y="497" fill="#8F8F8A" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Un espacio privado para hablar, comprenderte y sentirte acompañado.</text>

  <g filter="url(#post-shadow)">
    <rect x="319" y="538" width="442" height="672" rx="76" fill="#232323" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="2"/>
    <g clip-path="url(#post-phone)">
      <rect x="344" y="564" width="392" height="620" fill="#F5F4F0"/>
      <rect x="344" y="564" width="392" height="72" fill="#F5F4F0"/>
      <path d="M378 601L390 589M378 601L390 613" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
      <text x="540" y="600" fill="#111" font-family="Georgia, serif" font-size="22" text-anchor="middle">Nora</text>
      <text x="540" y="620" fill="#777772" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">● APOYO EMOCIONAL</text>
      <circle cx="699" cy="600" r="18" fill="#111"/>
      <text x="699" y="606" fill="#FFF" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">R</text>
      <line x1="344" y1="636" x2="736" y2="636" stroke="#DFDEDA"/>

      <text x="540" y="688" fill="#999994" font-family="Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="middle">HOY</text>
      <circle cx="386" cy="753" r="18" fill="#111"/>
      <text x="386" y="760" fill="#FFF" font-family="Georgia, serif" font-size="22" text-anchor="middle">n</text>
      <text x="416" y="738" fill="#111" font-family="Arial, sans-serif" font-size="10" font-weight="700">Nora</text>
      <text x="416" y="766" fill="#272725" font-family="Arial, sans-serif" font-size="14">Te leo. No necesitas ordenar</text>
      <text x="416" y="789" fill="#272725" font-family="Arial, sans-serif" font-size="14">todo antes de empezar.</text>

      <rect x="455" y="844" width="247" height="75" rx="20" fill="#E5E4E0"/>
      <text x="475" y="874" fill="#282826" font-family="Arial, sans-serif" font-size="14">Últimamente me siento mal,</text>
      <text x="475" y="898" fill="#282826" font-family="Arial, sans-serif" font-size="14">pero no sé por qué.</text>

      <circle cx="386" cy="978" r="18" fill="#111"/>
      <text x="386" y="985" fill="#FFF" font-family="Georgia, serif" font-size="22" text-anchor="middle">n</text>
      <text x="416" y="963" fill="#111" font-family="Arial, sans-serif" font-size="10" font-weight="700">Nora</text>
      <text x="416" y="991" fill="#272725" font-family="Arial, sans-serif" font-size="14">Está bien no tener una respuesta</text>
      <text x="416" y="1014" fill="#272725" font-family="Arial, sans-serif" font-size="14">todavía. ¿Quieres contarme cómo</text>
      <text x="416" y="1037" fill="#272725" font-family="Arial, sans-serif" font-size="14">se ha sentido tu día?</text>

      <rect x="366" y="1094" width="348" height="64" rx="22" fill="#FFFFFF" stroke="#D4D3CF"/>
      <text x="388" y="1133" fill="#999994" font-family="Arial, sans-serif" font-size="12">Escribe lo que estás sintiendo…</text>
      <circle cx="681" cy="1126" r="20" fill="#111"/>
      <path d="M681 1134V1118M675 1124L681 1118L687 1124" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="471" y="551" width="138" height="24" rx="12" fill="#232323"/>
  </g>

  <g transform="translate(67 1219)">
    <rect width="244" height="58" rx="29" fill="#F7F7F4"/>
    <text x="27" y="36" fill="#0A0A0A" font-family="Arial, sans-serif" font-size="14" font-weight="700">Conoce a Nora</text>
    <circle cx="211" cy="29" r="19" fill="#0A0A0A"/>
    <path d="M204 29H218M213 24L218 29L213 34" stroke="#FFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
