  <text x="1015" y="1246" fill="#8C8C87" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.4" text-anchor="end">NORAAI.QZZ.IO</text>
  <text x="1015" y="1271" fill="#62625E" font-family="Arial, sans-serif" font-size="9" text-anchor="end">Creada por Gerard Ramces Bollard Gonzalez</text>

