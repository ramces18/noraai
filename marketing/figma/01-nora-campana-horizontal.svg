      <rect x="873" y="417" width="304" height="61" fill="#F4F3EF"/>
      <circle cx="909" cy="448" r="17" fill="#0A0A0A"/>
      <text x="909" y="456" fill="#FFFFFF" font-family="Georgia, serif" font-size="22" text-anchor="middle">n</text>
      <text x="947" y="453" fill="#111" font-family="Georgia, serif" font-size="20">Nora</text>
      <circle cx="1142" cy="448" r="16" fill="#111"/>
      <text x="1142" y="453" fill="#FFF" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">R</text>
      <text x="899" y="548" fill="#8A8983" font-family="Arial, sans-serif" font-size="8" letter-spacing="1.2">HOY, 10:08</text>
      <circle cx="911" cy="600" r="15" fill="#111"/>
      <text x="911" y="607" fill="#FFF" font-family="Georgia, serif" font-size="19" text-anchor="middle">n</text>
      <text x="940" y="585" fill="#111" font-family="Arial, sans-serif" font-size="10" font-weight="700">Nora</text>
      <text x="940" y="608" fill="#2C2C2A" font-family="Arial, sans-serif" font-size="12">Te leo. ¿Qué parte de hoy</text>
      <text x="940" y="628" fill="#2C2C2A" font-family="Arial, sans-serif" font-size="12">se sintió más pesada?</text>
      <rect x="953" y="682" width="194" height="76" rx="18" fill="#E5E4E0"/>
      <text x="971" y="712" fill="#262624" font-family="Arial, sans-serif" font-size="12">No sé explicarlo bien.</text>
      <text x="971" y="734" fill="#262624" font-family="Arial, sans-serif" font-size="12">Solo necesitaba hablar.</text>
      <circle cx="911" cy="817" r="15" fill="#111"/>
      <text x="911" y="824" fill="#FFF" font-family="Georgia, serif" font-size="19" text-anchor="middle">n</text>
      <text x="940" y="802" fill="#111" font-family="Arial, sans-serif" font-size="10" font-weight="700">Nora</text>
      <text x="940" y="825" fill="#2C2C2A" font-family="Arial, sans-serif" font-size="12">No tienes que explicarlo</text>
      <text x="940" y="845" fill="#2C2C2A" font-family="Arial, sans-serif" font-size="12">perfecto. Podemos quedarnos</text>
      <text x="940" y="865" fill="#2C2C2A" font-family="Arial, sans-serif" font-size="12">aquí un momento.</text>
      <rect x="892" y="925" width="266" height="55" rx="20" fill="#FFFFFF" stroke="#D3D2CE"/>
      <text x="911" y="958" fill="#969690" font-family="Arial, sans-serif" font-size="11">Escribe lo que sientes…</text>
      <circle cx="1131" cy="952" r="18" fill="#111"/>
      <path d="M1131 959V945M1126 950L1131 945L1136 950" stroke="#FFF" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    <rect x="957" y="405" width="137" height="22" rx="11" fill="#202020"/>
  </g>

  <g transform="translate(1440 700)">
