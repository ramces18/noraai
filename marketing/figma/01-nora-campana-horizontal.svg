    <text x="28" y="37" fill="#8C8C87" font-family="Arial, sans-serif" font-size="8" letter-spacing="1.7">ACOMPAÑAMIENTO A TU RITMO</text>
    <text x="28" y="79" fill="#FFFFFF" font-family="Georgia, serif" font-size="28">Escucha primero.</text>
    <text x="28" y="111" fill="#FFFFFF" font-family="Georgia, serif" font-size="28">Orienta después.</text>
    <line x1="28" y1="137" x2="316" y2="137" stroke="#FFFFFF" stroke-opacity=".13"/>
    <text x="28" y="157" fill="#82827D" font-family="Arial, sans-serif" font-size="8">PRIVADO · PERSONALIZABLE · ACCESIBLE</text>
  </g>

