<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1780" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171717"/>
      <stop offset=".48" stop-color="#080808"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="glass" x1="930" y1="120" x2="1730" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".04"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="38" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
